services:
  postgres:
    image: postgres:16-alpine
    container_name: madlibrary-team-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: madlibrary_team
      POSTGRES_USER: madlibrary
      POSTGRES_PASSWORD: madlibrary
    ports:
      - "54329:5432"
    volumes:
      - madlibrary_team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madlibrary -d madlibrary_team"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  madlibrary_team_pgdata:
