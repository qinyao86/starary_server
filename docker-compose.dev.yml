services:
  postgres:
    image: postgres:16-alpine
    container_name: starary-team-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: starary_team
      POSTGRES_USER: starary
      POSTGRES_PASSWORD: starary
    ports:
      - "54329:5432"
    volumes:
      - starary_team_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starary -d starary_team"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  starary_team_pgdata:
